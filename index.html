<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOB GMAIL BY ZEN</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-color: #58a6ff;
      --text-color: #c9d1d9;
      --success-color: #238636;
      --danger-color: #da3633;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h2, h3 {
      margin-top: 0;
      color: var(--accent-color);
      text-align: center;
    }
    input, button, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0 12px 0;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #0d1117;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-danger {
      background-color: var(--danger-color);
    }
    .btn-success {
      background-color: var(--success-color);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px;
    }
    th, td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #21262d;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }
    .badge-pending { background-color: #8b949e; color: #fff; }
    .badge-success { background-color: var(--success-color); color: #fff; }
    .badge-danger { background-color: var(--danger-color); color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Branding -->
    <div class="card">
      <h2>JOB GMAIL BY ZEN</h2>
      <p style="text-align: center; margin: 0; font-size: 14px;">WELCOME BACK DI</p>
    </div>

    <!-- Panel Setor Gmail -->
    <div class="card">
      <h3>Form Setor Gmail</h3>
      <label>Nama Member:</label>
      <input type="text" id="memberName" placeholder="Masukkan nama kamu..." />

      <label>Data Gmail & Password:</label>
      <input type="text" id="gmailData" placeholder="email@gmail.com|password" />
      
      <button onclick="submitSetoran()">Kirim Setoran</button>
    </div>

    <!-- Status Saldo & Penarikan Member -->
    <div class="card">
      <h3>Cek Saldo & Penarikan</h3>
      <input type="text" id="checkName" placeholder="Masukkan nama kamu untuk cek saldo..." />
      <button onclick="loadMemberData()">Cek Saldo</button>

      <div id="saldoInfo" style="display: none; margin-top: 12px;">
        <p>Total Akun Acc: <b id="totalAcc">0</b></p>
        <p>Total Saldo: <b id="totalBalance">Rp 0</b></p>

        <h4>Form Penarikan (Min Rp 3.500)</h4>
        <input type="number" id="wdAmount" placeholder="Jumlah WD (Kelipatan 3500)" />
        <select id="wdMethod">
          <option value="DANA">DANA</option>
          <option value="GOPAY">GOPAY</option>
          <option value="OVO">OVO</option>
          <option value="BANK">BANK</option>
        </select>
        <input type="text" id="wdAccount" placeholder="Nomor E-Wallet / Rekening" />
        <button class="btn-success" onclick="requestWithdrawal()">Minta Penarikan</button>
      </div>
    </div>

    <!-- Admin Panel (Dilindungi PIN sederhananya) -->
    <div class="card" style="border-color: var(--accent-color);">
      <h3>Admin Panel</h3>
      <input type="password" id="adminPin" placeholder="Masukkan PIN Admin..." />
      <button onclick="unlockAdmin()">Buka Admin Panel</button>

      <div id="adminSection" style="display: none; margin-top: 16px;">
        <h4>Daftar Setoran Masuk</h4>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Nama</th>
                <th>Data Gmail</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="adminTableSetoran"></tbody>
          </table>
        </div>

        <h4 style="margin-top: 20px;">Edit Saldo Member Manual</h4>
        <input type="text" id="editMemberName" placeholder="Nama Member" />
        <input type="number" id="editMemberBalance" placeholder="Jumlah Saldo Baru (Rp)" />
        <button onclick="updateMemberBalance()">Simpan Saldo Baru</button>

        <h4 style="margin-top: 20px;">Daftar Penarikan (WD)</h4>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Nama</th>
                <th>Jumlah</th>
                <th>Tujuan</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="adminTableWD"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // --- 1. ANTI-INSPECT & ANTI-DEBUGGER LAYER ---
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
      if (e.keyCode == 123 || 
         (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) ||
         (e.ctrlKey && e.keyCode == 85)) {
        return false;
      }
    };
    setInterval(() => {
      const before = new Date().getTime();
      debugger;
      const after = new Date().getTime();
      if (after - before > 100) {
        window.location.reload();
      }
    }, 1000);

    // --- 2. FIREBASE CONFIGURATION & INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDc2SPUv8pvy4CU2v4InbHbGxbdBqcvRM0",
      authDomain: "zensetor-f3640.firebaseapp.com",
      databaseURL: "https://zensetor-f3640-default-rtdb.firebaseio.com",
      projectId: "zensetor-f3640",
      storageBucket: "zensetor-f3640.firebasestorage.app",
      messagingSenderId: "451295986923",
      appId: "1:451295986923:web:fe9d3bcca285be6725eaae",
      measurementId: "G-TCSM336833"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const RATE_PER_EMAIL = 3500;

    // --- 3. FITUR MEMBER ---
    function submitSetoran() {
      const name = document.getElementById('memberName').value.trim();
      const data = document.getElementById('gmailData').value.trim();

      if (!name || !data) {
        alert("Harap isi nama dan data gmail!");
        return;
      }

      const newRef = db.ref('setoran').push();
      newRef.set({
        nama: name,
        data: data,
        status: 'pending',
        timestamp: Date.now()
      }).then(() => {
        alert("Setoran berhasil dikirim!");
        document.getElementById('gmailData').value = '';
      });
    }

    function loadMemberData() {
      const name = document.getElementById('checkName').value.trim();
      if (!name) {
        alert("Masukkan nama kamu!");
        return;
      }

      db.ref('users/' + name).on('value', snapshot => {
        const userData = snapshot.val() || { balance: 0, accCount: 0 };
        document.getElementById('totalAcc').innerText = userData.accCount || 0;
        document.getElementById('totalBalance').innerText = 'Rp ' + (userData.balance || 0).toLocaleString('id-ID');
        document.getElementById('saldoInfo').style.display = 'block';
      });
    }

    function requestWithdrawal() {
      const name = document.getElementById('checkName').value.trim();
      const amount = parseInt(document.getElementById('wdAmount').value);
      const method = document.getElementById('wdMethod').value;
      const account = document.getElementById('wdAccount').value.trim();

      if (!name || !amount || !account) {
        alert("Lengkapi data penarikan!");
        return;
      }
      if (amount < 3500) {
        alert("Minimal penarikan adalah Rp 3.500!");
        return;
      }

      db.ref('users/' + name).once('value', snapshot => {
        const userData = snapshot.val() || { balance: 0 };
        if (userData.balance < amount) {
          alert("Saldo tidak cukup!");
          return;
        }

        const newWd = db.ref('withdrawals').push();
        newWd.set({
          nama: name,
          amount: amount,
          method: method,
          account: account,
          status: 'pending',
          timestamp: Date.now()
        }).then(() => {
          // Potong saldo sementara/pending
          db.ref('users/' + name + '/balance').set(userData.balance - amount);
          alert("Permintaan penarikan berhasil dikirim!");
          document.getElementById('wdAmount').value = '';
          document.getElementById('wdAccount').value = '';
        });
      });
    }

    // --- 4. FITUR ADMIN PANEL ---
    function unlockAdmin() {
      const pin = document.getElementById('adminPin').value;
      if (pin === "1234") { // PIN Admin Default: 1234
        document.getElementById('adminSection').style.display = 'block';
        listenAdminData();
      } else {
        alert("PIN Admin Salah!");
      }
    }

    function listenAdminData() {
      // Sync Data Setoran Masuk
      db.ref('setoran').on('value', snapshot => {
        const tbody = document.getElementById('adminTableSetoran');
        tbody.innerHTML = '';
        snapshot.forEach(child => {
          const id = child.key;
          const val = child.val();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${val.nama}</td>
            <td>${val.data}</td>
            <td><span class="badge badge-${val.status}">${val.status}</span></td>
            <td>
              ${val.status === 'pending' ? `
                <button onclick="approveSetoran('${id}', '${val.nama}')">Acc</button>
                <button class="btn-danger" onclick="rejectSetoran('${id}')">Tolak</button>
              ` : '-'}
            </td>
          `;
          tbody.appendChild(tr);
        });
      });

      // Sync Data Penarikan
      db.ref('withdrawals').on('value', snapshot => {
        const tbody = document.getElementById('adminTableWD');
        tbody.innerHTML = '';
        snapshot.forEach(child => {
          const id = child.key;
          const val = child.val();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${val.nama}</td>
            <td>Rp ${val.amount.toLocaleString('id-ID')}</td>
            <td>${val.method} - ${val.account}</td>
            <td><span class="badge badge-${val.status}">${val.status}</span></td>
            <td>
              ${val.status === 'pending' ? `
                <button onclick="approveWD('${id}')">Selesai</button>
              ` : '-'}
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    function approveSetoran(id, nama) {
      db.ref('setoran/' + id + '/status').set('ACC');
      db.ref('users/' + nama).once('value', snapshot => {
        const userData = snapshot.val() || { balance: 0, accCount: 0 };
        db.ref('users/' + nama).set({
          balance: (userData.balance || 0) + RATE_PER_EMAIL,
          accCount: (userData.accCount || 0) + 1
        });
      });
    }

    function rejectSetoran(id) {
      db.ref('setoran/' + id + '/status').set('REJECTED');
    }

    function updateMemberBalance() {
      const name = document.getElementById('editMemberName').value.trim();
      const newBal = parseInt(document.getElementById('editMemberBalance').value);

      if (!name || isNaN(newBal)) {
        alert("Masukkan nama member dan jumlah saldo baru!");
        return;
      }

      db.ref('users/' + name + '/balance').set(newBal).then(() => {
        alert("Saldo " + name + " berhasil diperbarui!");
        document.getElementById('editMemberName').value = '';
        document.getElementById('editMemberBalance').value = '';
      });
    }

    function approveWD(id) {
      db.ref('withdrawals/' + id + '/status').set('SUCCESS');
    }
  </script>
</body>
</html>
