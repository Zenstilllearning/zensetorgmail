<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenSetorGmail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }

</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <div id="app" class="max-w-md mx-auto w-full bg-slate-50 min-h-screen shadow-2xl flex flex-col justify-between relative pb-20">
        <div class="p-8 text-center text-slate-400 font-semibold text-xs">Memuat ZenSetorGmail...</div>
    </div>

    <!-- Firebase SDK V9 Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDc2SPUv8pvy4CU2v4InbHbGxbdBqcvRM0",
            authDomain: "zensetor-f3640.firebaseapp.com",
            databaseURL: "https://zensetor-f3640-default-rtdb.firebaseio.com",
            projectId: "zensetor-f3640",
            storageBucket: "zensetor-f3640.firebasestorage.app",
            messagingSenderId: "451295986923",
            appId: "1:451295986923:web:fe9d3bcca285be6725eaae",
            measurementId: "G-TCSM336833"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        window.db = {
            users: {},
            currentUser: null,
            rate: 3500,
            minWd: 3500,
            isOpen: true,
            announcement: "SATU WEBSITE, SEMUA UNTUNG !! Siap bikin usahamu jadi tujuan utama pelanggan? Dengan ZenSetorGmail, kamu bisa jual akun gmail dari semua provider dengan mudah dan untung besar!",
            withdraws: {},
            setorQueue: {}
        };

        const ADMIN_USER = "Zen Kujou Takanashi Mikadono";
        const ADMIN_PASS = "ha12ha34";

        let isLoginMode = true;
        let activeTab = 'home';
        let hasRendered = false;

        // Fallback jika koneksi lambat
        setTimeout(() => {
            if (!hasRendered) {
                render();
            }
        }, 1500);

        // Realtime Listener Firebase
        onValue(ref(database, '/'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.db.users = data.users || {};
                window.db.rate = data.rate ?? 3500;
                window.db.minWd = data.minWd ?? 3500;
                window.db.isOpen = data.isOpen ?? true;
                window.db.announcement = data.announcement || window.db.announcement;
                window.db.withdraws = data.withdraws || {};
                window.db.setorQueue = data.setorQueue || {};
            }
            render();
        }, (error) => {
            console.error("Firebase Security / Network Error:", error);
            render();
        });

        window.render = function() {
            hasRendered = true;
            const container = document.getElementById('app');
            if (!container) return;
            
            if (!db.currentUser) {
                container.innerHTML = renderAuth();
            } else {
                container.innerHTML = renderDashboard();
            }
        };

        function renderAuth() {
            return `
                <div class="p-6 flex flex-col justify-center min-h-screen">
                    <div class="text-center mb-8">
                        <div class="inline-flex p-4 bg-purple-600 text-white rounded-3xl mb-3 text-3xl shadow-lg shadow-purple-500/30">
                            🚀
                        </div>
                        <h1 class="text-2xl font-black tracking-tight text-slate-900">ZenSetorGmail</h1>
                        <p class="text-xs text-slate-500 mt-1">Platform setor & withdraw gmail terpercaya</p>
                    </div>

                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-xl space-y-4">
                        <h2 class="text-lg font-bold text-slate-800">${isLoginMode ? 'Login Akun' : 'Daftar Akun Baru'}</h2>
                        
                        <div>
                            <label class="text-xs font-semibold text-slate-600">Username</label>
                            <div class="flex items-center mt-1 border border-slate-200 rounded-2xl px-3.5 py-3 bg-slate-50/50">
                                <span class="mr-2">👤</span>
                                <input type="text" id="authUsername" placeholder="Masukkan username" class="w-full text-xs font-medium outline-none bg-transparent">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-semibold text-slate-600">Password</label>
                            <div class="flex items-center mt-1 border border-slate-200 rounded-2xl px-3.5 py-3 bg-slate-50/50">
                                <span class="mr-2">🔒</span>
                                <input type="password" id="authPassword" placeholder="Masukkan password" class="w-full text-xs font-medium outline-none bg-transparent">
                            </div>
                        </div>

                        <button onclick="window.handleAuth()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-purple-500/25 hover:opacity-95 transition">
                            ${isLoginMode ? 'Login' : 'Daftar'}
                        </button>

                        <p class="text-center text-xs text-slate-500 mt-4">
                            ${isLoginMode ? 'Belum punya akun?' : 'Sudah punya akun?'} 
                            <button onclick="window.switchAuthMode()" class="text-purple-600 font-bold ml-1">
                                ${isLoginMode ? 'Daftar sini' : 'Login sini'}
                            </button>
                        </p>
                    </div>
                </div>
            `;
        }

        window.switchAuthMode = function() {
            isLoginMode = !isLoginMode;
            render();
        };

        window.handleAuth = function() {
            const u = document.getElementById('authUsername').value.trim();
            const p = document.getElementById('authPassword').value.trim();

            if (!u || !p) {
                alert('Username dan password harus diisi!');
                return;
            }

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                db.currentUser = ADMIN_USER;
                render();
                return;
            }

            const userList = Object.values(db.users || {});

            if (isLoginMode) {
                const found = userList.find(x => x.username === u);
                if (!found) {
                    alert('Maaf, akun kamu tidak terdaftar di sini');
                    return;
                }
                if (found.password !== p) {
                    alert('Password yang kamu masukkan salah!');
                    return;
                }
                db.currentUser = u;
                render();
            } else {
                const exists = userList.find(x => x.username === u);
                if (exists) {
                    alert('Username sudah terdaftar!');
                    return;
                }
                
                set(ref(database, 'users/' + u), { username: u, password: p, balance: 0, totalEmails: 0 });
                db.currentUser = u;
                render();
            }
        };

        function renderDashboard() {
            const userList = Object.values(db.users || {});
            const user = userList.find(x => x.username === db.currentUser) || { balance: 0, totalEmails: 0 };
            
            return `
                <div class="pb-6">
                    <div class="px-5 pt-4 pb-2 flex justify-end">
                        <button onclick="window.setTab('info')" class="w-8 h-8 rounded-full bg-slate-200/60 text-slate-600 flex items-center justify-center font-bold text-sm">
                            ?
                        </button>
                    </div>

                    <div class="px-5">
                        ${activeTab === 'home' ? renderHomeTab(user) : ''}
                        ${activeTab === 'setor' ? renderSetorTab(user) : ''}
                        ${activeTab === 'withdraw' ? renderWithdrawTab(user) : ''}
                        ${activeTab === 'riwayat' ? renderRiwayatTab() : ''}
                        ${activeTab === 'info' ? renderInfoTab() : ''}
                        ${activeTab === 'profil' ? renderProfilTab(user) : ''}
                        ${activeTab === 'admin' ? renderAdminPanel() : ''}
                    </div>
                </div>

                <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-100 px-3 py-2 flex justify-around items-center text-[10px] font-semibold text-slate-400 shadow-2xl z-50">
                    <button onclick="window.setTab('home')" class="flex flex-col items-center gap-1 ${activeTab==='home'?'text-purple-600':''}">
                        <div class="p-1.5 rounded-xl ${activeTab==='home'?'bg-purple-100':''}">🏠</div>
                        Home
                    </button>
                    <button onclick="window.setTab('setor')" class="flex flex-col items-center gap-1 ${activeTab==='setor'?'text-purple-600':''}">
                        <div class="p-1.5 rounded-xl ${activeTab==='setor'?'bg-purple-100':''}">🚀</div>
                        Setor
                    </button>
                    <button onclick="window.setTab('withdraw')" class="flex flex-col items-center gap-1 ${activeTab==='withdraw'?'text-purple-600':''}">
                        <div class="p-1.5 rounded-xl ${activeTab==='withdraw'?'bg-purple-100':''}">💸</div>
                        Withdraw
                    </button>
                    <button onclick="window.setTab('riwayat')" class="flex flex-col items-center gap-1 ${activeTab==='riwayat'?'text-purple-600':''}">
                        <div class="p-1.5 rounded-xl ${activeTab==='riwayat'?'bg-purple-100':''}">🕒</div>
                        Riwayat
                    </button>
                    <button onclick="window.setTab('info')" class="flex flex-col items-center gap-1 ${activeTab==='info'?'text-purple-600':''}">
                        <div class="p-1.5 rounded-xl ${activeTab==='info'?'bg-purple-100':''}">ℹ️</div>
                        Info
                    </button>
                    <button onclick="window.setTab('profil')" class="flex flex-col items-center gap-1 ${activeTab==='profil'?'text-purple-600':''}">
                        <div class="p-1.5 rounded-xl ${activeTab==='profil'?'bg-purple-100':''}">👤</div>
                        Profil
                    </button>
                    <button onclick="window.setTab('admin')" class="flex flex-col items-center gap-1 ${activeTab==='admin'?'text-purple-600':''}">
                        <div class="p-1.5 rounded-xl ${activeTab==='admin'?'bg-purple-100':''}">🛡️</div>
                        Admin
                    </button>
                </div>
            `;
        }

        window.setTab = function(tab) {
            activeTab = tab;
            render();
        };

        function renderHomeTab(user) {
            const userList = Object.values(db.users || {});
            const totalUsers = userList.length;
            const totalEmailsAll = userList.reduce((acc, curr) => acc + (curr.totalEmails || 0), 0);

            return `
                <div class="bg-gradient-to-br from-purple-600 via-indigo-600 to-violet-700 text-white p-6 rounded-[2.5rem] shadow-xl shadow-purple-500/20 mb-4 relative overflow-hidden">
                    <div class="flex items-center gap-2 mb-1 opacity-90">
                        <span class="text-sm">🚀</span>
                        <span class="text-[11px] font-bold tracking-widest uppercase text-purple-200">WELCOME BACK DI</span>
                    </div>

                    <h1 class="text-2xl font-black tracking-tight mb-2">JOB GMAIL BY ZEN</h1>
                    <p class="text-xs text-purple-100 leading-relaxed mb-6 font-medium">Setor Gmail, langsung cuan dengan rate terbaik di pasaran ⚡</p>

                    <div class="flex items-center gap-2 mb-6">
                        <button onclick="window.toggleOpenStatus()" class="px-3.5 py-1.5 ${db.isOpen ? 'bg-emerald-400' : 'bg-red-500'} text-white text-[10px] font-black rounded-full tracking-wider hover:opacity-90">
                            ${db.isOpen ? 'OPEN' : 'CLOSE'}
                        </button>
                        <span class="glass-card px-3.5 py-1.5 text-white text-[10px] font-bold rounded-full flex items-center gap-1 border border-white/20">
                            ⚡ Rp ${(db.rate || 3500).toLocaleString('id-ID')}/email
                        </span>
                    </div>

                    <button onclick="window.setTab('setor')" class="w-full bg-white text-purple-700 font-bold py-3.5 rounded-2xl shadow-lg flex items-center justify-center gap-2 hover:bg-slate-50 transition text-xs">
                        Mulai Sekarang ➔
                    </button>
                </div>

                <div class="bg-gradient-to-r from-purple-700 to-indigo-700 text-white px-4 py-2.5 rounded-2xl mb-5 shadow-sm flex items-center gap-3 overflow-hidden">
                    <span class="text-sm flex-shrink-0">📢</span>
                    <marquee class="text-xs font-medium text-purple-100" scrollamount="5">
                        ${db.announcement}
                    </marquee>
                </div>

                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
                        <div class="w-10 h-10 bg-purple-100 text-purple-600 rounded-2xl mx-auto flex items-center justify-center mb-2 text-sm font-bold">👤</div>
                        <h3 class="text-base font-black text-slate-800">${totalUsers}</h3>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">PENGGUNA</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
                        <div class="w-10 h-10 bg-purple-100 text-purple-600 rounded-2xl mx-auto flex items-center justify-center mb-2 text-sm font-bold">✉️</div>
                        <h3 class="text-base font-black text-slate-800">${totalEmailsAll.toLocaleString('id-ID')}</h3>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">TOTAL EMAIL</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
                        <div class="w-10 h-10 bg-purple-100 text-purple-600 rounded-2xl mx-auto flex items-center justify-center mb-2 text-sm font-bold">📈</div>
                        <h3 class="text-base font-black text-slate-800">100%</h3>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">SUKSES</p>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-2">
                    <div class="flex items-center gap-2 text-purple-700 font-bold text-xs">
                        <span>📢</span> Pengumuman
                    </div>
                    <p class="text-xs text-slate-600 leading-relaxed">${db.announcement}</p>
                </div>
            `;
        }

        window.toggleOpenStatus = function() {
            if (db.currentUser !== ADMIN_USER) return;
            update(ref(database, '/'), { isOpen: !db.isOpen });
        };

        function renderSetorTab(user) {
            return `
                <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-xl space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h3 class="font-bold text-sm text-slate-800">Setor Gmail Baru</h3>
                        <span class="text-xs font-semibold text-purple-600">Rate: Rp ${(db.rate || 3500).toLocaleString('id-ID')}</span>
                    </div>
                    
                    ${db.isOpen ? `
                        <div id="validationError"></div>
                        <textarea id="gmailList" rows="6" placeholder="email@gmail.com|password (Satu per baris)" class="w-full text-xs p-3.5 border border-slate-200 rounded-2xl outline-none focus:border-purple-500 font-mono bg-slate-50/50"></textarea>
                        <button onclick="window.submitSetor()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3.5 rounded-2xl text-xs font-bold shadow-lg shadow-purple-500/20 hover:opacity-95 transition">
                            Kirim Setoran Sekarang
                        </button>
                    ` : `
                        <div class="p-4 bg-red-50 text-red-600 text-xs rounded-2xl text-center font-bold">Mohon Maaf, Setoran Gmail sedang CLOSE.</div>
                    `}
                </div>
            `;
        }

        window.submitSetor = function() {
            const el = document.getElementById('gmailList');
            if (!el) return;
            const rawVal = el.value.trim();
            if (!rawVal) {
                alert('Masukkan daftar Gmail terlebih dahulu!');
                return;
            }

            const lines = rawVal.split('\n').map(l => l.trim()).filter(l => l !== '');
            const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/i;
            
            let validList = [];
            let invalidList = [];
            let duplicateCount = 0;
            const seenEmails = new Set();

            lines.forEach((line, index) => {
                const parts = line.split('|');
                if (parts.length >= 2) {
                    const email = parts[0].trim();
                    const emailLower = email.toLowerCase();
                    const password = parts.slice(1).join('|').trim();

                    const isEmailValid = gmailRegex.test(email);
                    const isPasswordValid = password.length > 0;

                    if (isEmailValid && isPasswordValid) {
                        if (seenEmails.has(emailLower)) {
                            duplicateCount++;
                        } else {
                            seenEmails.add(emailLower);
                            validList.push({ email, password });
                        }
                    } else {
                        let reason = [];
                        if (!isEmailValid) reason.push('Format Gmail salah');
                        if (!isPasswordValid) reason.push('Password kosong');
                        invalidList.push(`Baris ${index + 1} (${line}): ${reason.join(', ')}`);
                    }
                } else {
                    invalidList.push(`Baris ${index + 1} (${line}): Format harus email|password`);
                }
            });

            const errorContainer = document.getElementById('validationError');
            let infoHTML = '';

            if (duplicateCount > 0) {
                infoHTML += `
                    <div class="p-3 bg-amber-50 border border-amber-100 rounded-xl text-xs text-amber-700 mb-2">
                        <p class="font-bold">⚠️ Otomatis Memfilter Duplikat:</p>
                        <p>${duplicateCount} email duplikat telah dibersihkan.</p>
                    </div>
                `;
            }

            if (invalidList.length > 0) {
                infoHTML += `
                    <div class="p-3 bg-red-50 border border-red-100 rounded-xl text-xs text-red-600 mb-3 space-y-1">
                        <p class="font-bold">Terdapat ${invalidList.length} entri tidak valid:</p>
                        <ul class="list-disc pl-4 space-y-0.5 max-h-24 overflow-y-auto">
                            ${invalidList.map(err => `<li>${err}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (errorContainer) errorContainer.innerHTML = infoHTML;

            if (validList.length === 0) {
                alert('Tidak ada data Gmail unik & valid untuk dikirim!');
                return;
            }

            if (confirm(`Ditemukan ${validList.length} Gmail unik dan valid. Kirim ke antrean admin?`)) {
                validList.forEach(item => {
                    const newRef = push(ref(database, 'setorQueue'));
                    set(newRef, {
                        id: newRef.key,
                        user: db.currentUser,
                        email: item.email,
                        password: item.password,
                        status: 'Pending',
                        date: new Date().toLocaleDateString('id-ID')
                    });
                });

                alert(`Berhasil mengirim ${validList.length} Gmail ke Firebase!`);
                el.value = '';
            }
        };

        function renderWithdrawTab(user) {
            return `
                <div class="space-y-4">
                    <div class="bg-gradient-to-br from-emerald-500 to-teal-600 text-white p-6 rounded-3xl shadow-lg shadow-emerald-500/20">
                        <span class="text-xs font-semibold uppercase tracking-wider text-emerald-100">Saldo Tersedia</span>
                        <h2 class="text-3xl font-black mt-1">Rp ${(user.balance || 0).toLocaleString('id-ID')}</h2>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-xl space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                            <h3 class="font-bold text-sm text-slate-800">Form Withdraw</h3>
                            <span class="text-xs font-semibold text-emerald-600">Min: Rp ${(db.minWd || 3500).toLocaleString('id-ID')}</span>
                        </div>

                        <div>
                            <label class="text-xs font-semibold text-slate-600">Nominal Penarikan</label>
                            <input type="number" id="wdAmount" placeholder="Nominal Rp" class="w-full text-xs p-3.5 mt-1 border border-slate-200 rounded-2xl outline-none focus:border-emerald-500 bg-slate-50/50">
                        </div>

                        <div>
                            <label class="text-xs font-semibold text-slate-600">Metode Pembayaran</label>
                            <select id="wdMethod" class="w-full text-xs p-3.5 mt-1 border border-slate-200 rounded-2xl outline-none focus:border-emerald-500 bg-slate-50/50">
                                <option value="DANA">DANA</option>
                                <option value="GOPAY">GOPAY</option>
                                <option value="OVO">OVO</option>
                                <option value="BANK">BANK</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-semibold text-slate-600">Nomor Rekening / E-Wallet</label>
                            <input type="text" id="wdAccount" placeholder="Nomor E-Wallet/Rekening" class="w-full text-xs p-3.5 mt-1 border border-slate-200 rounded-2xl outline-none focus:border-emerald-500 bg-slate-50/50">
                        </div>

                        <button onclick="window.submitWithdraw()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-3.5 rounded-2xl text-xs font-bold shadow-lg shadow-emerald-500/20 hover:opacity-95 transition">
                            Tarik Saldo
                        </button>
                    </div>
                </div>
            `;
        }

        window.submitWithdraw = function() {
            const amount = parseInt(document.getElementById('wdAmount').value);
            const method = document.getElementById('wdMethod').value;
            const account = document.getElementById('wdAccount').value.trim();
            
            const userList = Object.values(db.users || {});
            const user = userList.find(x => x.username === db.currentUser);

            if (!amount || !account) {
                alert('Lengkapi nominal dan nomor tujuan!');
                return;
            }

            if (amount < (db.minWd || 3500)) {
                alert(`Minimal penarikan adalah Rp ${(db.minWd || 3500).toLocaleString('id-ID')}!`);
                return;
            }

            if (!user || user.balance < amount) {
                alert('Saldo kamu tidak mencukupi!');
                return;
            }

            const newBal = user.balance - amount;
            update(ref(database, 'users/' + db.currentUser), { balance: newBal });

            const newWdRef = push(ref(database, 'withdraws'));
            set(newWdRef, {
                id: newWdRef.key,
                user: db.currentUser,
                amount: amount,
                method: method,
                account: account,
                status: 'Pending',
                date: new Date().toLocaleDateString('id-ID')
            });

            alert('Permintaan penarikan berhasil diajukan!');
        };

        function renderRiwayatTab() {
            const setorList = Object.values(db.setorQueue || {});
            const wdList = Object.values(db.withdraws || {});

            const mySetor = setorList.filter(x => x.user === db.currentUser).reverse();
            const myWd = wdList.filter(x => x.user === db.currentUser).reverse();

            return `
                <div class="space-y-4">
                    <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                        <h3 class="font-bold text-sm text-slate-800 mb-3">Riwayat Setor Gmail</h3>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${mySetor.length === 0 ? '<p class="text-xs text-slate-400">Belum ada riwayat setor.</p>' : ''}
                            ${mySetor.map(item => `
                                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl text-xs">
                                    <div class="truncate max-w-[180px]">
                                        <p class="font-bold text-slate-700 truncate">${item.email}</p>
                                        <p class="text-[10px] text-slate-400">${item.date}</p>
                                    </div>
                                    <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${item.status === 'Approved' ? 'bg-emerald-100 text-emerald-600' : item.status === 'Rejected' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-600'}">
                                        ${item.status}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                        <h3 class="font-bold text-sm text-slate-800 mb-3">Riwayat Withdraw</h3>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${myWd.length === 0 ? '<p class="text-xs text-slate-400">Belum ada riwayat withdraw.</p>' : ''}
                            ${myWd.map(item => `
                                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl text-xs">
                                    <div>
                                        <p class="font-bold text-slate-700">Rp ${item.amount.toLocaleString('id-ID')}</p>
                                        <p class="text-[10px] text-slate-400">${item.method} - ${item.account} (${item.date})</p>
                                    </div>
                                    <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${item.status === 'Success' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}">
                                        ${item.status}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderInfoTab() {
            return `
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4 text-xs text-slate-600 leading-relaxed">
                    <h3 class="font-bold text-base text-slate-800">Informasi & Aturan</h3>
                    <p>Selamat datang di <b>ZenSetorGmail</b>! Tempat paling aman dan cepat untuk menjual akun Gmail milikmu.</p>
                    <ul class="list-disc pl-4 space-y-2">
                        <li>Rate harga per email: <b>Rp ${(db.rate || 3500).toLocaleString('id-ID')}</b></li>
                        <li>Minimal penarikan saldo: <b>Rp ${(db.minWd || 3500).toLocaleString('id-ID')}</b></li>
                        <li>Proses penarikan diproses cepat via DANA, GOPAY, OVO, atau BANK.</li>
                        <li>Pastikan format setoran: <code>email@gmail.com|password</code></li>
                    </ul>
                </div>
            `;
        }

        function renderProfilTab(user) {
            return `
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center space-y-4">
                    <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-full mx-auto flex items-center justify-center text-2xl font-bold">
                        👤
                    </div>
                    <div>
                        <h2 class="font-bold text-lg text-slate-800">${db.currentUser}</h2>
                        <p class="text-xs text-slate-400">Status: Member</p>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-2xl text-left space-y-2 text-xs">
                        <div class="flex justify-between">
                            <span class="text-slate-500">Saldo:</span>
                            <span class="font-bold text-slate-800">Rp ${(user.balance || 0).toLocaleString('id-ID')}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-500">Total Email ACC:</span>
                            <span class="font-bold text-slate-800">${user.totalEmails || 0} Email</span>
                        </div>
                    </div>
                    <button onclick="db.currentUser=null; window.render();" class="w-full bg-red-50 text-red-600 py-3 rounded-2xl text-xs font-bold hover:bg-red-100 transition">
                        Logout Akun
                    </button>
                </div>
            `;
        }

        function renderAdminPanel() {
            if (db.currentUser !== ADMIN_USER) {
                return `
                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center">
                        <h3 class="font-bold text-red-600 text-sm">Akses Ditolak!</h3>
                        <p class="text-xs text-slate-500 mt-1">Kamu harus login menggunakan akun Admin untuk mengakses panel ini.</p>
                    </div>
                `;
            }

            const setorList = Object.entries(db.setorQueue || {}).map(([key, val]) => ({ ...val, _key: key }));
            const userList = Object.values(db.users || {});
            const wdList = Object.entries(db.withdraws || {}).map(([key, val]) => ({ ...val, _key: key }));

            return `
                <div class="space-y-4">
                    <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                        <h3 class="font-bold text-sm text-purple-600">Pengaturan Web & Pengumuman</h3>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <label class="font-semibold text-slate-600">Rate per Email</label>
                                <input type="number" id="adminRate" value="${db.rate || 3500}" class="w-full p-2 border rounded-xl mt-1">
                            </div>
                            <div>
                                <label class="font-semibold text-slate-600">Min Withdraw</label>
                                <input type="number" id="adminMinWd" value="${db.minWd || 3500}" class="w-full p-2 border rounded-xl mt-1">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-semibold text-slate-600">Teks Pengumuman Website</label>
                            <textarea id="adminAnnouncement" rows="3" class="w-full text-xs p-2.5 mt-1 border rounded-xl outline-none focus:border-purple-500 bg-slate-50/50">${db.announcement || ''}</textarea>
                        </div>

                        <button onclick="window.updateAdminConfig()" class="w-full bg-purple-600 text-white text-xs font-bold py-2.5 rounded-xl hover:bg-purple-700 transition">
                            Simpan Pengaturan & Pengumuman
                        </button>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                        <h3 class="font-bold text-sm text-slate-800">Database Member (${userList.length})</h3>
                        <div class="space-y-2 max-h-56 overflow-y-auto text-xs">
                            ${userList.length === 0 ? '<p class="text-slate-400">Belum ada member terdaftar.</p>' : ''}
                            ${userList.map(u => `
                                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between items-center">
                                    <div>
                                        <p class="font-bold text-slate-800">${u.username}</p>
                                        <p class="text-[10px] text-slate-500">Saldo: <span class="text-emerald-600 font-bold">Rp ${(u.balance || 0).toLocaleString('id-ID')}</span> | ACC: ${u.totalEmails || 0}</p>
                                    </div>
                                    <button onclick="window.adminEditBalance('${u.username.replace(/'/g, "\\'")}', ${u.balance || 0})" class="bg-purple-100 text-purple-700 font-bold px-3 py-1.5 rounded-xl text-[10px] hover:bg-purple-200">
                                        Edit Saldo
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                        <h3 class="font-bold text-sm text-slate-800">Request Withdraw Member</h3>
                        <div class="space-y-2 max-h-56 overflow-y-auto text-xs">
                            ${wdList.length === 0 ? '<p class="text-slate-400">Belum ada request withdraw.</p>' : ''}
                            ${wdList.reverse().map(item => `
                                <div class="p-3 bg-slate-50 rounded-2xl space-y-1 border border-slate-100">
                                    <div class="flex justify-between font-bold">
                                        <span>${item.user} - Rp ${item.amount.toLocaleString('id-ID')}</span>
                                        <span class="${item.status==='Success'?'text-emerald-600':'text-amber-600'}">${item.status}</span>
                                    </div>
                                    <p class="text-[11px] text-slate-600 font-medium">${item.method}: ${item.account}</p>
                                    ${item.status === 'Pending' ? `
                                        <button onclick="window.processWdQueue('${item._key}')" class="w-full bg-emerald-500 text-white font-bold py-1 rounded-lg text-[10px] mt-1">
                                            ACC / Selesai Transfer
                                        </button>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                        <h3 class="font-bold text-sm text-slate-800">Antrean Setor Gmail</h3>
                        <div class="space-y-2 max-h-56 overflow-y-auto text-xs">
                            ${setorList.length === 0 ? '<p class="text-slate-400">Tidak ada antrean.</p>' : ''}
                            ${setorList.reverse().map(item => `
                                <div class="p-3 bg-slate-50 rounded-2xl space-y-1 border border-slate-100">
                                    <div class="flex justify-between font-bold">
                                        <span>${item.user}</span>
                                        <span class="${item.status==='Approved'?'text-emerald-600':item.status==='Rejected'?'text-red-600':'text-amber-600'}">${item.status}</span>
                                    </div>
                                    <p class="font-mono text-[11px] text-slate-600 break-all">${item.email}|${item.password}</p>
                                    ${item.status === 'Pending' ? `
                                        <div class="flex gap-2 pt-1">
                                            <button onclick="window.processSetorQueue('${item._key}', '${item.user.replace(/'/g, "\\'")}', true)" class="flex-1 bg-emerald-500 text-white font-bold py-1 rounded-lg text-[10px]">ACC</button>
                                            <button onclick="window.processSetorQueue('${item._key}', '${item.user.replace(/'/g, "\\'")}', false)" class="flex-1 bg-red-500 text-white font-bold py-1 rounded-lg text-[10px]">Tolak</button>
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.updateAdminConfig = function() {
            const r = parseInt(document.getElementById('adminRate').value) || 3500;
            const w = parseInt(document.getElementById('adminMinWd').value) || 3500;
            const ann = document.getElementById('adminAnnouncement').value.trim();
            
            update(ref(database, '/'), {
                rate: r,
                minWd: w,
                announcement: ann
            });
            alert('Pengaturan & Pengumuman berhasil disimpan!');
        };

        window.adminEditBalance = function(username, currentBalance) {
            const input = prompt(`Masukkan jumlah saldo baru untuk member "${username}":`, currentBalance);
            if (input !== null) {
                const newBal = parseInt(input);
                if (isNaN(newBal) || newBal < 0) {
                    alert('Nominal saldo tidak valid!');
                    return;
                }
                update(ref(database, 'users/' + username), { balance: newBal });
                alert(`Saldo member ${username} berhasil diperbarui menjadi Rp ${newBal.toLocaleString('id-ID')}`);
            }
        };

        window.processWdQueue = function(key) {
            update(ref(database, 'withdraws/' + key), { status: 'Success' });
            alert('Status withdraw berhasil diubah jadi Success!');
        };

        window.processSetorQueue = function(key, username, isApprove) {
            const status = isApprove ? 'Approved' : 'Rejected';
            
            update(ref(database, 'setorQueue/' + key), { status: status });

            if (isApprove) {
                const userObj = db.users[username] || { balance: 0, totalEmails: 0 };
                const curBal = userObj.balance || 0;
                const curTotal = userObj.totalEmails || 0;

                update(ref(database, 'users/' + username), {
                    balance: curBal + (db.rate || 3500),
                    totalEmails: curTotal + 1
                });
            }
        };
    </script>
</body>
</html>
